name: Node.js CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Завантаження коду репозиторію
        uses: actions/checkout@v4

      - name: Встановлення Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Встановлення залежностей
        run: npm install

      - name: Запуск білд-процесу
        run: npm run build

      - name: Збереження результату білду як артефакт
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

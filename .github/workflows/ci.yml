name: Node.js Docker CI and EC2 Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Отримати короткий хеш коміту
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Авторизація в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Збірка та пуш Docker-образу
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nodeapp:latest

      - name: Декодувати SSH-ключ із Base64
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/ec2_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ec2_key ~/.ssh/known_hosts

      - name: Розгорнути Docker-контейнер на EC2
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<REMOTE
          sudo systemctl stop nodeapp || true
          sudo systemctl disable nodeapp || true
          pm2 delete all || true

          if ! command -v docker &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y docker.io docker-compose-v2
            sudo systemctl enable --now docker
            sudo usermod -aG docker \$USER
          fi

          sudo docker pull $DOCKERHUB_USERNAME/nodeapp:${{ steps.vars.outputs.sha_short }}
          sudo docker rm -f nodeapp || true
          sudo docker run -d --name nodeapp --restart always -p 3000:3000 $DOCKERHUB_USERNAME/nodeapp:${{ steps.vars.outputs.sha_short }}

          sleep 3
          curl --fail --silent --show-error --retry 10 --retry-delay 2 http://127.0.0
          REMOTE

      - name: Видалити тимчасовий SSH-ключ
        if: always()
        run: rm -f ~/.ssh/ec2_key



